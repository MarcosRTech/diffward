# .gitlab-ci.yml
diffward:
  image: debian:stable-slim # the release binary needs glibc
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0
  script:
    - apt-get update -qq && apt-get install -yqq --no-install-recommends git curl ca-certificates
    - curl -fsSL https://github.com/MarcosRTech/diffward/releases/latest/download/install.sh | DIFFWARD_INSTALL_DIR=/usr/local/bin sh
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - diffward --diff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --fail-on high --format markdown -o diffward.md --sarif gl-diffward.sarif
  after_script:
    - cat diffward.md
  artifacts:
    when: always
    paths: [diffward.md, gl-diffward.sarif]
