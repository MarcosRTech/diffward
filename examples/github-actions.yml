# .github/workflows/security.yml
name: security

on:
  pull_request:

permissions:
  contents: read
  security-events: write # only needed for the SARIF upload

jobs:
  diffward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # diffward needs the base commit to compute the diff

      - id: diffward
        uses: MarcosRTech/diffward@v0
        with:
          fail-on: high # critical | high | medium | low | info | none

      # Inline alerts on the PR via GitHub Code Scanning.
      # Free for public repositories; private ones need GitHub Advanced Security.
      # Without it, delete this step: the job summary and exit code still work.
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.diffward.outputs.sarif-file != ''
        with:
          sarif_file: ${{ steps.diffward.outputs.sarif-file }}
          category: diffward
