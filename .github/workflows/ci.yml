name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build && node dist/diffward.js --version

  # diffward scanning itself through the local action, as a user would.
  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diffward
        uses: ./
        with:
          fail-on: high
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.diffward.outputs.sarif-file != ''
        with:
          sarif_file: ${{ steps.diffward.outputs.sarif-file }}
          category: diffward
