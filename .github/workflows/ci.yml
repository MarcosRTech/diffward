name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build && node dist/diffward.js --version

  # diffward scanning itself through the local action, as a user would.
  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diffward
        uses: ./
        with:
          fail-on: high
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.diffward.outputs.sarif-file != ''
        with:
          sarif_file: ${{ steps.diffward.outputs.sarif-file }}
          category: diffward

  # The installers in this commit, against the latest published release, so
  # installer changes are exercised before they ship.
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh | tee install.log
          "$HOME/.local/bin/diffward" --version
          # non-interactive output: milestone lines, never a redrawn bar
          test "$(grep -c '% (' install.log)" -le 3
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 *>&1 | Tee-Object -Variable log
          & "$env:LOCALAPPDATA\diffward\bin\diffward.exe" --version
          $progress = @($log | Where-Object { "$_" -match '\d+%' }).Count
          if ($progress -gt 3) { throw "expected at most 3 progress lines in CI, got $progress" }
