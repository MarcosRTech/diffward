name: release
on:
  workflow_call:
    inputs:
      tag-name:
        type: string

permissions:
  contents: read

jobs:
  env:
    runs-on: ubuntu-latest
    steps:
      - id: extract
        run: |
          # ruleid: gha/script-injection medium
          environment=$(echo "${{ inputs.tag-name }}" | sed -E 's/-.*$//')
          # ok: gha/script-injection
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then echo main; fi
      # ok: gha/unpinned-action
      - uses: ./.github/actions/setup
      # ok: gha/unpinned-action
      - uses: github/codeql-action/upload-sarif@v4
