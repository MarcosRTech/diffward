name: diffward
description: Scan pull requests for vulnerable dependencies (OSV) and insecure code patterns. Writes SARIF for GitHub Code Scanning.
author: MarcosRTech
branding:
  icon: shield
  color: orange

inputs:
  path:
    description: Directory to scan.
    default: "."
  diff-base:
    description: >
      Git ref or SHA to compare against; only issues introduced since the merge-base are reported.
      Defaults to the pull request base SHA on pull_request events, and to a full scan otherwise.
    default: ""
  fail-on:
    description: Fail the step when a finding is at or above this severity (critical, high, medium, low, info, none).
    default: high
  fail-on-quality:
    description: Also fail on quality (bad-practice) findings at or above this severity. Default none.
    default: none
  sarif-file:
    description: Where to write the SARIF report (empty to skip).
    default: diffward.sarif
  code:
    description: Run code analysis.
    default: "true"
  deps:
    description: Check dependencies against OSV.
    default: "true"
  args:
    description: Extra command-line arguments, e.g. "--deps-scope all".
    default: ""
  bun-version:
    description: Bun version used to run diffward.
    default: "1.3.6"

outputs:
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ steps.scan.outputs.sarif-file }}
  findings:
    description: Number of findings.
    value: ${{ steps.scan.outputs.findings }}
  failed:
    description: '"true" if a finding reached the fail-on severity.'
    value: ${{ steps.scan.outputs.failed }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install diffward
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && bun install --frozen-lockfile --production --silent

    - name: Run diffward
      id: scan
      shell: bash
      # Inputs go through env vars, never interpolated into the script.
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_DIFF_BASE: ${{ inputs.diff-base }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_QUALITY: ${{ inputs.fail-on-quality }}
        INPUT_SARIF: ${{ inputs.sarif-file }}
        INPUT_CODE: ${{ inputs.code }}
        INPUT_DEPS: ${{ inputs.deps }}
        INPUT_ARGS: ${{ inputs.args }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -uo pipefail
        args=("$INPUT_PATH" --fail-on "$INPUT_FAIL_ON" --fail-on-quality "$INPUT_FAIL_ON_QUALITY" --json "$RUNNER_TEMP/diffward.json" --markdown "$RUNNER_TEMP/diffward.md")

        base="${INPUT_DIFF_BASE:-$PR_BASE_SHA}"
        if [ -n "$base" ]; then
          if [ "$(git -C "$INPUT_PATH" rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::notice::Shallow clone detected; fetching history to find the merge-base (use fetch-depth: 0 to skip this)."
            git -C "$INPUT_PATH" fetch --no-tags --quiet --unshallow origin
          fi
          git -C "$INPUT_PATH" cat-file -e "$base^{commit}" 2>/dev/null || git -C "$INPUT_PATH" fetch --no-tags --quiet origin "$base"
          args+=(--diff "$base")
        fi
        [ -n "$INPUT_SARIF" ] && args+=(--sarif "$INPUT_SARIF")
        [ "$INPUT_CODE" = "false" ] && args+=(--no-code)
        [ "$INPUT_DEPS" = "false" ] && args+=(--no-deps)
        # shellcheck disable=SC2206
        [ -n "$INPUT_ARGS" ] && args+=($INPUT_ARGS)

        bun "$GITHUB_ACTION_PATH/src/cli.ts" "${args[@]}"
        code=$?

        [ -f "$RUNNER_TEMP/diffward.md" ] && cat "$RUNNER_TEMP/diffward.md" >> "$GITHUB_STEP_SUMMARY"
        if [ -f "$RUNNER_TEMP/diffward.json" ]; then
          echo "findings=$(bun -e 'console.log(require(process.argv[1]).findings.length)' "$RUNNER_TEMP/diffward.json")" >> "$GITHUB_OUTPUT"
        fi
        echo "sarif-file=$INPUT_SARIF" >> "$GITHUB_OUTPUT"
        echo "failed=$([ "$code" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        exit "$code"
